<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>You're offline · Study-IAL</title>
        <style>
            /* A static page (served by the service worker with no connection), so the app's tokens are restated here. */
            :root {
                --background: #fffaf4;
                --card: #ffffff;
                --foreground: #2b1240;
                --muted-foreground: #6b5579;
                --border: #ebe1d6;
                --primary: #ff7a3d;
                --on-primary: #2b1240;
                --ring: #5532d6;
                color-scheme: light dark;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --background: #1b1026;
                    --card: #261835;
                    --foreground: #fbf4ec;
                    --muted-foreground: #c2b2d0;
                    --border: #3b2b4f;
                    --ring: #a58bff;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: 24px 16px;
                background: var(--background);
                color: var(--foreground);
                font: 500 1rem/1.5 Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
            }
            main {
                width: 100%;
                max-width: 440px;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 28px;
                padding: 32px 24px;
                text-align: center;
                box-shadow: 0 12px 32px -20px rgb(43 18 64 / 0.25);
            }
            img {
                width: 56px;
                height: 56px;
                border-radius: 16px;
            }
            h1 {
                margin: 16px 0 8px;
                font-size: 1.75rem;
                line-height: 1.1;
                font-weight: 800;
            }
            p {
                margin: 0 0 12px;
                color: var(--muted-foreground);
            }
            button {
                margin-top: 12px;
                min-height: 44px;
                padding: 0 20px;
                border: 0;
                border-radius: 9999px;
                background: var(--primary);
                color: var(--on-primary);
                font-family: inherit;
                font-size: 0.975rem;
                font-weight: 800;
                line-height: 1;
                cursor: pointer;
            }
            button:focus-visible {
                outline: 3px solid var(--ring);
                outline-offset: 2px;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icon.png" alt="" />
            <h1>You're offline</h1>
            <p>Study-IAL needs a connection to load questions and save your marks.</p>
            <p>Nothing you've already saved is lost. Reconnect, then try again.</p>
            <button type="button" onclick="location.reload()">Try again</button>
        </main>
        <script>
            // Go back to where they were as soon as the connection returns.
            window.addEventListener("online", () => location.reload());
        </script>
    </body>
</html>
